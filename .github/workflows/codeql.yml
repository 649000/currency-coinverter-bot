# ==============================================================================
# GitHub Actions Workflow: CodeQL Static Application Security Testing (SAST)
# ==============================================================================
#
# PURPOSE:
# CodeQL is GitHub's industry-standard semantic code analysis engine.
# It performs SAST (Static Application Security Testing) by treating your code
# as a database:
#   1. Extracts the Abstract Syntax Tree (AST), symbol tables, and control flow graphs.
#   2. Tracks "taint" (untrusted data from Telegram webhooks or user input) as it
#      flows through your Java methods, services, and repositories.
#   3. Identifies CWEs (Common Weakness Enumerations) such as:
#      - Injection vulnerabilities (Command, SQL, NoSQL injection)
#      - Insecure deserialization
#      - Path traversal / Unsafe file access
#      - Cryptographic weaknesses & secret leakage
#
# RESULTS & ALERTS:
# - Findings appear in your repository under:
#   GitHub Repo -> Security -> Code scanning alerts.
# - Blocks pull requests if high-severity vulnerabilities are introduced.
# ==============================================================================

name: "Security Scan - CodeQL (SAST)"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

  # Scheduled scan every Sunday at midnight (UTC 16:00 = SGT 00:00 Monday)
  # Ensures zero-day disclosures in existing code are caught over time
  schedule:
    - cron: '0 16 * * 0'

  # Allows on-demand scanning from the Actions tab
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to publish alerts to the GitHub Security tab

    steps:
      # ------------------------------------------------------------------------
      # Step 1: Checkout repository code
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Step 2: Set up Java 21 JDK
      # ------------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ------------------------------------------------------------------------
      # Step 3: Initialize CodeQL Database
      # ------------------------------------------------------------------------
      # Initializes the CodeQL toolchain for Java analysis.
      # 'security-extended' includes additional security queries beyond the default suite.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'java-kotlin'
          queries: security-extended

      # ------------------------------------------------------------------------
      # Step 4: Build Java Code for CodeQL Extraction
      # ------------------------------------------------------------------------
      # CodeQL monitors compiler invocations to capture semantic relationships.
      # Compiling in standard JVM mode without tests is fast (~20s).
      - name: Compile Java Codebase
        run: mvn clean compile -DskipTests

      # ------------------------------------------------------------------------
      # Step 5: Execute CodeQL Analysis Queries
      # ------------------------------------------------------------------------
      # Runs QL queries against the generated database and uploads the SARIF
      # (Static Analysis Results Interchange Format) report to GitHub Security.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
